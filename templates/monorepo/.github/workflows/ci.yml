name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        name: static & unit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Static checks
              run: pnpm check:ci:static
            - name: Unit tests
              run: pnpm check:ci:unit
