pre-commit:
    jobs:
        - name: lint (staged)
          glob: "*.{ts,tsx,cts,mts}"
          run: node_modules/.bin/tsx scripts/run-oxlint.ts --fix --no-error-on-unmatched-pattern {staged_files}
          stage_fixed: true
        - name: oxfmt
          glob: "*.{js,jsx,ts,tsx,cjs,mjs,cts,mts,json,jsonc}"
          run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
          stage_fixed: true
pre-push:
    jobs:
        - name: typecheck (affected)
          run: pnpm run typecheck
